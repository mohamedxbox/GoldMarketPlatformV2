name: GoldMarketPlatform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore .\GoldMarketPlatform\GoldMarketPlatform.csproj

    - name: Build Project
      run: dotnet build .\GoldMarketPlatform\GoldMarketPlatform.csproj --no-restore

    - name: Run Unit Tests
      run: dotnet test .\GoldMarketPlatform.Tests\GoldMarketPlatform.Tests.csproj --no-restore
